<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NNP CU | Admin Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #f3f7f3;
            font-family: Arial, sans-serif;
        }

        .navbar {
            background: #176b3a;
        }

        .dashboard-card {
            background: white;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.05);
        }

        .brand {
            color: #176b3a;
            font-weight: 700;
        }
    </style>
</head>

<body>

<nav class="navbar navbar-dark px-4 py-3">
    <span class="navbar-brand fw-bold">NNP CU Administration</span>
    <button id="logoutButton" class="btn btn-outline-light btn-sm">
        Logout
    </button>
</nav>

<main class="container py-5">

    <h2 class="brand mb-2">Announcement Dashboard</h2>
    <p class="text-muted mb-4">
        Manage announcements for the NNP Christian Union website.
    </p>

    <div class="dashboard-card">
        <h5 class="mb-3">Create Announcement</h5>

        <form id="announcementForm">

            <div class="mb-3">
                <label class="form-label">Announcement Title</label>
                <input type="text" id="announcementTitle"
                       class="form-control" required maxlength="100">
            </div>

            <div class="mb-3">
                <label class="form-label">Announcement Message</label>
                <textarea id="announcementMessage"
                          class="form-control" rows="5"
                          required maxlength="2000"></textarea>
            </div>

            <div class="mb-3">
                <label class="form-label">Category</label>
                <select id="announcementCategory" class="form-select">
                    <option value="General">General</option>
                    <option value="Event">Event</option>
                    <option value="Prayer">Prayer</option>
                    <option value="Ministry">Ministry</option>
                    <option value="Urgent">Urgent</option>
                </select>
            </div>

            <button type="submit" id="publishButton"
                    class="btn btn-success">
                Publish Announcement
            </button>

            <div id="statusMessage" class="mt-3"></div>

        </form>
    </div>

    <div class="dashboard-card mt-4">
        <h5 class="mb-3">Published Announcements</h5>
        <div id="announcementsList">
            Loading announcements...
        </div>
    </div>

</main>

<script type="module" src="../js/firebase-config.js"></script>
<script type="module" src="dashboard.js"></script>

</body>
</html>
