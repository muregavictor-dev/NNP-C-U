<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">

</head>
<body>
  <div class="app-backdrop" id="sidebarBackdrop"></div>
  <aside class="sidebar" id="sidebar">

      <span class="brand-mark">EM</span>
      <span class="brand-copy">NNP CU<small>EXECUTIVE </small></span>

    <div class="sidebar-label">WORKSPACE</div>

      <button class="nav-item" data-module="announcements"><span class="nav-icon">◉</span><span>Announcements</span></button>
      <button class="nav-item" data-module="events"><span class="nav-icon">▦</span><span>Events &amp; Calendar</span></button>
      <button class="nav-item" data-module="media"><span class="nav-icon">▧</span><span>Media &amp; Resources</span></button>
      <div class="nav-divider"></div>
      <div class="sidebar-label nav-group-label">PEOPLE &amp; MINISTRY</div>
      <button class="nav-item" data-module="membership"><span class="nav-icon">♙</span><span>Membership</span></button>

      <button class="nav-item" data-module="settings"><span class="nav-icon">⚙</span><span>Settings</span></button>
    </nav>
    <div class="sidebar-bottom">
      <div class="connection-card"><span class="online-dot" id="connectionDot"></span><span><small>DATABASE</small><strong id="connectionState">Checking connection</strong></span></div>
      <a class="site-link" href="../index.html"><span>↗</span> View public website</a>

  <div class="page-shell">
    <header class="topbar">

        <button class="menu-toggle" id="menuToggle" aria-label="Open navigation" aria-expanded="false">☰</button>

        <div class="user-chip"><span class="avatar" id="adminInitials">A</span><span class="user-details"><strong id="adminName">Administrator</strong><small id="adminEmail">Authorized account</small></span></div>

    <main class="content" id="mainContent" aria-live="polite"></main>
    <footer class="page-footer"><span>NNP Christian Union</span><span>Administration workspace</span></footer>

  <div class="toast-wrap" id="toastWrap" aria-live="polite" aria-atomic="true"></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="../js/firebase-config.js"></script>
  <script type="module" src="dashboard.js"></script>
